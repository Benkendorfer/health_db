[project]
name = "health_db"
version = "0.1.0"
description = "Apple Health data parsing and analysis"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "pillow>=12.2",
    "scipy>=1.17",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
